name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4

      - name: Mettre Godot en cache
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Télécharger Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot

      # Le premier import crée le cache des classes (.godot/), nécessaire aux scripts.
      - name: Importer le projet
        run: ~/godot/godot --headless --import --path .

      # Chaque texte marqué à traduire (tr(), textes des scènes) doit avoir sa traduction anglaise.
      - name: Vérifier les traductions
        run: python3 tools/textes_a_traduire.py

      - name: Lancer les tests
        run: ~/godot/godot --headless --fixed-fps 60 --path . -s res://tests/run_tests.gd
